name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest pytests -q

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy runs pip on the build machine, so it needs the same Python version as the app.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The runner already has the Android SDK; install the platform and build tools the app uses.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: chmod +x gradlew
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: slm-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
